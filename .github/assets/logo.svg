<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="96" height="96" role="img" aria-label="Xcavate logo: a magnifier over layers of earth">
  <defs>
    <clipPath id="tile"><rect width="100" height="100" rx="20"/></clipPath>
    <clipPath id="lens"><circle cx="43" cy="42" r="20.75"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="100" height="100" fill="#1E2B30"/>
    <rect y="50" width="100" height="10" fill="#727366"/>
    <rect y="60" width="100" height="10" fill="#625849"/>
    <rect y="70" width="100" height="30" fill="#4F473F"/>
    <g clip-path="url(#lens)">
      <rect width="100" height="50" fill="#3C5058"/>
      <rect y="50" width="100" height="10" fill="#D9CBA9"/>
      <rect y="60" width="100" height="10" fill="#B48E6B"/>
      <rect y="70" width="100" height="30" fill="#8A6A52"/>
    </g>
    <circle cx="43" cy="42" r="25" fill="none" stroke="#F1F3EF" stroke-width="8.5"/>
    <line x1="63.7" y1="62.7" x2="84" y2="83" stroke="#F1F3EF" stroke-width="15" stroke-linecap="round"/>
  </g>
</svg>
