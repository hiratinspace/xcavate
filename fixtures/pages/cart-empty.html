<head><meta charset="utf-8"><title>Your cart | Beanhouse (fictional)</title><style>body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#1d1d1f;background:#fafafa}header,footer{background:#222;color:#fff;padding:14px 24px}header a,footer a{color:#fff;margin-right:16px}main{max-width:980px;margin:32px auto;padding:0 20px}.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.tier{background:#fff;border:1px solid #ddd;border-radius:10px;padding:20px}.price{font-size:28px;font-weight:700}.btn{display:inline-block;background:#3346d3;color:#fff;border-radius:8px;padding:10px 18px;text-decoration:none}</style></head>
