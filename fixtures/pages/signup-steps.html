<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Choose your plan | Flickbox (fictional)</title><style>body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#1d1d1f;background:#fafafa}header,footer{background:#222;color:#fff;padding:14px 24px}header a,footer a{color:#fff;margin-right:16px}main{max-width:980px;margin:32px auto;padding:0 20px}.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.tier{background:#fff;border:1px solid #ddd;border-radius:10px;padding:20px}.price{font-size:28px;font-weight:700}.btn{display:inline-block;background:#3346d3;color:#fff;border-radius:8px;padding:10px 18px;text-decoration:none}</style></head>
<body>
  <!-- Real-world pattern: step 1 of a sign-up flow served at /signup/planform. The price sits under a
       "Monthly price" label in its own element and the only call to action is "Next". -->
  <header><strong>Flickbox</strong></header>
  <main>
    <p>Step 1 of 3</p>
    <h1>Choose the plan that's right for you</h1>
    <div class="tiers">
      <div class="tier"><h2>Basic</h2><dl><dt>Monthly price</dt><dd>$7.99</dd><dt>Resolution</dt><dd>720p</dd></dl></div>
      <div class="tier"><h2>Standard</h2><dl><dt>Monthly price</dt><dd>$15.49</dd><dt>Resolution</dt><dd>1080p</dd></dl></div>
    </div>
    <p><button type="button" class="btn">Next</button></p>
  </main>
  <footer><a href="/legal/termsofuse">Terms of Use</a><a href="/legal/privacy">Privacy</a><span>Flickbox is fictional, for testing only.</span></footer>
</body>
</html>
