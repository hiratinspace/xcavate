<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arc desk lamp | ShopApp</title>
  <style>:root{--brand:#0f766e}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#1d1d1f;background:#fafafa}
a{color:var(--brand)}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
.site-header{background:var(--brand);color:#fff}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{color:#fff;font-weight:800;font-size:22px;text-decoration:none;letter-spacing:-.5px}
.site-header nav a{color:#fff;margin-left:20px;text-decoration:none;opacity:.9}
.promo{background:#111;color:#eee;text-align:center;font-size:13px;padding:6px}
main{padding:32px 0 48px}
.site-footer{background:#202124;color:#bbb;font-size:14px;padding:28px 0}
.site-footer a{color:#ddd;margin-right:18px}
.site-footer .note{margin-top:12px;font-size:12px;color:#888}
.policy{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:32px 40px;max-width:780px}
.policy h1{margin-top:0}
.policy .updated{color:#666;font-size:14px}
.policy h2{font-size:20px;margin-top:32px}
.toc{background:#f6f6f6;border-radius:8px;padding:12px 20px;font-size:14px}
.btn{display:inline-block;background:var(--brand);color:#fff;border:0;border-radius:8px;padding:12px 22px;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.secondary{background:#fff;color:var(--brand);border:2px solid var(--brand)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:24px}
.hero-img{aspect-ratio:4/3;border-radius:10px;background:linear-gradient(135deg,var(--brand),#ddd)}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
label.inline{display:inline;font-weight:400}
input[type=text],input[type=email],input[type=tel]{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:16px}
.row{display:flex;gap:12px}.row>div{flex:1}
.summary table{width:100%;border-collapse:collapse}
.summary td{padding:6px 0}.summary td.amt{text-align:right}
.summary tr.total td{border-top:1px solid #ddd;font-weight:700;padding-top:10px}
.legal-note{font-size:13px;color:#555}
</style>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="/">ShopApp</a>
      <nav aria-label="Main"><a href="/">Shop</a></nav>
    </div>
  </header>
  <main>
    <div class="wrap">
      <div id="app">
        <section class="grid" id="product-view">
          <div class="hero-img" role="img" aria-label="Arc desk lamp"></div>
          <div>
            <h1>Arc desk lamp</h1>
            <p class="price"><strong>$45.00</strong></p>
            <p>A warm, dimmable LED desk lamp with a weighted brass base.</p>
            <p><button type="button" class="btn" id="add">Add to cart</button></p>
            <p><button type="button" class="btn secondary" id="go-checkout">Go to checkout</button></p>
          </div>
        </section>
      </div>
      <template id="checkout-template">
        <section class="grid" id="checkout-view">
          <form class="card" id="checkout" onsubmit="return false" novalidate>
            <h1>Checkout</h1>

          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com">

          <label for="cc-name">Name on card</label>
          <input type="text" id="cc-name" name="ccname" autocomplete="cc-name" placeholder="Alex Example">
          <label for="cc-number">Card number</label>
          <input type="text" id="cc-number" name="cardnumber" autocomplete="cc-number" inputmode="numeric" placeholder="4242 4242 4242 4242">
          <div class="row">
            <div><label for="cc-exp">Expiry (MM/YY)</label><input type="text" id="cc-exp" name="cc-exp" autocomplete="cc-exp" placeholder="12/29"></div>
            <div><label for="cc-csc">CVC</label><input type="text" id="cc-csc" name="cvc" autocomplete="cc-csc" inputmode="numeric" placeholder="123"></div>
          </div>
            <div class="pay" style="margin-top:20px">
              <button type="button" class="btn" id="pay">Place order</button>
              <p class="legal-note" id="agree">By placing your order you agree to our <a data-route="/terms">Terms of Sale</a>.</p>
            </div>
            <p><a data-route="/" id="back">Back to the shop</a></p>
          </form>
          <aside class="card summary" aria-label="Order summary">
            <h2>Order summary</h2>
            <table>
              <tr><td>Subtotal</td><td class="amt">$45.00</td></tr>
              <tr><td>Shipping</td><td class="amt">$5.00</td></tr>
              <tr><td>Tax</td><td class="amt">$3.60</td></tr>
              <tr class="total"><td>Total</td><td class="amt">$53.60</td></tr>
            </table>
          </aside>
        </section>
      </template>
      <script>
        (function () {
          // Works on shopapp.localhost:4000/ and on the path-prefix fallback localhost:4000/shopapp/.
          var base = location.pathname.indexOf("/shopapp") === 0 ? "/shopapp" : "";
          var app = document.getElementById("app");
          var productHtml = app.innerHTML;
          function route() {
            var path = location.pathname.slice(base.length).replace(/\/+$/, "") || "/";
            return path;
          }
          function render() {
            if (route() === "/checkout") {
              app.innerHTML = "";
              app.appendChild(document.getElementById("checkout-template").content.cloneNode(true));
              app.querySelectorAll("a[data-route]").forEach(function (a) {
                a.setAttribute("href", base + a.getAttribute("data-route"));
              });
              document.getElementById("back").addEventListener("click", function (e) {
                e.preventDefault();
                history.pushState({}, "", base + "/");
                render();
              });
              document.title = "Checkout | ShopApp";
            } else {
              app.innerHTML = productHtml;
              document.getElementById("go-checkout").addEventListener("click", function () {
                history.pushState({}, "", base + "/checkout");
                render();
              });
              document.title = "Arc desk lamp | ShopApp";
            }
          }
          window.addEventListener("popstate", render);
          render();
        })();
      </script>
    </div>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <a href="/terms">Terms of Sale</a>
      <a href="/">Contact</a>
      <div class="note">&copy; 2026 ShopApp Labs. ShopApp is a fictional company created to test the Xcavate browser extension. Nothing here is for sale.</div>
    </div>
  </footer>
</body>
</html>
